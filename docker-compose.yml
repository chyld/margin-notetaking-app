name: margin

services:
  margin:
    build: .
    ports:
      - "5555:5555"
    volumes:
      - ./data:/data
    # Run as your host user so files in ./data stay owned by you.
    user: "${MARGIN_UID:-1000}:${MARGIN_GID:-1000}"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
