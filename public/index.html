<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Margin</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main id="login-view" hidden>
      <form id="login-form">
        <h1>Margin</h1>
        <label>
          Username
          <input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </label>
        <label>
          Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Log in</button>
        <p id="login-error" role="alert"></p>
      </form>
    </main>

    <div id="app-view" hidden>
      <aside id="sidebar">
        <header>
          <button id="collapse" class="icon" type="button" aria-controls="sidebar" aria-expanded="true"
                  aria-label="Hide sidebar" title="Hide sidebar">«</button>
          <span class="brand">Margin</span>
          <button id="logout" type="button">Log out</button>
        </header>
        <select id="tag-filter" aria-label="Show notes with tag">
          <option value="">All notes</option>
        </select>
        <button id="new-note" type="button">New note</button>
        <ul id="note-list"></ul>
        <p id="list-empty" hidden>No notes yet</p>
      </aside>
      <section id="editor">
        <div id="menu-bar">
          <button id="expand" class="icon" type="button" aria-controls="sidebar" aria-expanded="false"
                  aria-label="Show sidebar" title="Show sidebar" hidden>»</button>
          <ul id="note-tags" aria-label="Tags"></ul>
          <input id="tag-input" type="text" placeholder="add tag…" aria-label="Add tag" autocomplete="off"
                 autocapitalize="none" spellcheck="false" maxlength="64" disabled>
          <button id="save" type="button" data-state="none" disabled>Save</button>
        </div>
        <p id="tag-message" role="alert"></p>
        <textarea id="note-text" disabled spellcheck="false" placeholder="Select a note or create a new one."></textarea>
        <div id="status" aria-live="polite"></div>
      </section>
    </div>
  </body>
</html>
